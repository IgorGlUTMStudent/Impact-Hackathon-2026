{% load static i18n %}
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gustul Cărților{% endblock %}</title>
  
  <!-- PWA Meta & Icons -->
  <meta name="theme-color" content="#3B82F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/icons/icon-192.png' %}">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="{% static 'css/child.css' %}">

  <!-- HTMX & CSRF header integration -->
  <script src="{% static 'js/htmx.min.js' %}"></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="child-app">
    <header class="child-header">
      <a href="/copil/" class="child-profile-badge" aria-label="Acasă - pagina copilului">
        {% if child.avatar %}
          <img src="{% static 'img/avatars/' %}{{ child.avatar }}.svg" alt="{{ child.nickname }}" class="child-avatar-img" width="48" height="48">
        {% else %}
          <img src="{% static 'img/avatars/fox.svg' %}" alt="Avatar" class="child-avatar-img" width="48" height="48">
        {% endif %}
        <span class="child-nickname">{{ child.nickname|default:"Copil" }}</span>
      </a>

      <a href="/parinte/" class="child-exit-btn" aria-label="Zonă pentru părinți">
        <span>🔒</span>
        <span>{% translate "Părinți" %}</span>
      </a>
    </header>

    <main class="child-content" id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .catch((err) => console.debug('SW registration note:', err));
      });
    }
  </script>
</body>
</html>
