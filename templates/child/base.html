{% load static i18n %}
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gustul Cărților{% endblock %}</title>

  <!-- PWA Meta & Icons -->
  <meta name="theme-color" content="#3B82F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/icons/icon-192.png' %}">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{% static 'css/child.css' %}">

  <!-- HTMX & Child Controller -->
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/child.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="child-app">
    <header class="child-header">
      <a href="/copil/" class="child-profile-badge" aria-label="Acasă - pagina copilului">
        <!-- Strict avatar allowlist with complete file names: the static tag must never receive a
             partial path — the production manifest storage only resolves full entries (#56). -->
        {% if child.avatar %}
          <img src="{% if child.avatar == 'fox' %}{% static 'img/avatars/fox.svg' %}{% elif child.avatar == 'owl' %}{% static 'img/avatars/owl.svg' %}{% elif child.avatar == 'cat' %}{% static 'img/avatars/cat.svg' %}{% elif child.avatar == 'bear' %}{% static 'img/avatars/bear.svg' %}{% elif child.avatar == 'rabbit' %}{% static 'img/avatars/rabbit.svg' %}{% elif child.avatar == 'hedgehog' %}{% static 'img/avatars/hedgehog.svg' %}{% elif child.avatar == 'squirrel' %}{% static 'img/avatars/squirrel.svg' %}{% elif child.avatar == 'turtle' %}{% static 'img/avatars/turtle.svg' %}{% else %}{% static 'img/avatars/fox.svg' %}{% endif %}" alt="{{ child.nickname }}" class="child-avatar-img" width="48" height="48">
        {% else %}
          <img src="{% static 'img/avatars/fox.svg' %}" alt="Avatar" class="child-avatar-img" width="48" height="48">
        {% endif %}
        <span class="child-nickname">{{ child.nickname|default:"Copil" }}</span>
      </a>

      <a href="/parinte/" class="child-exit-btn" aria-label="Zonă pentru părinți">
        <span>🔒</span>
        <span>{% translate "Părinți" %}</span>
      </a>
    </header>

    <main class="child-content" id="main-content">
      {% block content %}{% endblock %}
    </main>

    <!-- Accessible status announcement container for HTMX responses/errors -->
    <div id="child-toast" class="child-toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .catch((err) => console.debug('SW registration note:', err));
      });
    }
  </script>
</body>
</html>
