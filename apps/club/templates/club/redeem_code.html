<!doctype html><html lang="ro"><meta charset="utf-8"><title>Cod de club</title>
<h1>Cod de club</h1>
{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{% url 'redeem_code' %}">{% csrf_token %}
<label>Cod <input name="code" required autocomplete="off"></label>
<label>Cititor <select name="reader"><option value="self">Pentru mine</option>
{% for child in children %}<option value="{{ child.public_id }}">{{ child.nickname }}</option>{% endfor %}
</select></label><button type="submit">Activează</button></form></html>
