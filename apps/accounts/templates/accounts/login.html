{% extends "accounts/_page.html" %}{% block content %}
<h1>Intră în cont</h1>
{% if locked_minutes %}<p role="alert">Prea multe încercări, încearcă peste {{ locked_minutes }} min.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button>Intră</button></form>
<p><a href="{% url 'signup' %}">Creează cont</a></p>
{% endblock %}
