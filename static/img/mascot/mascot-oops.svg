<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Mascot Oops">
  <!-- Body & tail -->
  <path d="M40 95 Q30 100 20 95 Q10 90 22 80 Q32 75 42 82 Z" fill="#3B82F6"/>
  <ellipse cx="60" cy="78" rx="30" ry="28" fill="#3B82F6"/>
  <ellipse cx="60" cy="80" rx="20" ry="20" fill="#93C5FD"/>
  <!-- Scales -->
  <polygon points="56,18 64,18 60,10" fill="#F59E0B"/>
  <polygon points="68,26 75,28 72,18" fill="#F59E0B"/>
  <!-- Head slightly tilted -->
  <circle cx="60" cy="42" r="26" fill="#3B82F6"/>
  <!-- Snout -->
  <ellipse cx="60" cy="48" rx="16" ry="12" fill="#60A5FA"/>
  <circle cx="55" cy="44" r="2" fill="#1D4ED8"/>
  <circle cx="65" cy="44" r="2" fill="#1D4ED8"/>
  <!-- Small cute 'o' mouth (supportive oops) -->
  <circle cx="60" cy="51" r="3" fill="#1E3A8A"/>
  <!-- Cheeks -->
  <circle cx="43" cy="48" r="4.5" fill="#F472B6" opacity="0.6"/>
  <circle cx="77" cy="48" r="4.5" fill="#F472B6" opacity="0.6"/>
  <!-- Gentle curious wide eyes -->
  <circle cx="48" cy="37" r="5.5" fill="#FFFFFF"/>
  <circle cx="49" cy="37" r="3" fill="#1E3A8A"/>
  <circle cx="51" cy="35" r="1.2" fill="#FFFFFF"/>
  <circle cx="72" cy="37" r="5.5" fill="#FFFFFF"/>
  <circle cx="71" cy="37" r="3" fill="#1E3A8A"/>
  <circle cx="73" cy="35" r="1.2" fill="#FFFFFF"/>
  <!-- Mild empathetic eyebrows -->
  <path d="M44 29 Q49 32 53 30" stroke="#1E3A8A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M67 30 Q71 32 76 29" stroke="#1E3A8A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Hands held together gently in front -->
  <circle cx="53" cy="76" r="5.5" fill="#2563EB"/>
  <circle cx="67" cy="76" r="5.5" fill="#2563EB"/>
  <!-- Feet -->
  <ellipse cx="45" cy="104" rx="8" ry="5" fill="#2563EB"/>
  <ellipse cx="75" cy="104" rx="8" ry="5" fill="#2563EB"/>
</svg>
