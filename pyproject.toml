[project]
name = "gustul-cartilor"
version = "0.1.0"
description = "Gustul Cărților — reading diary PWA (Impact Hackathon 2026)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=3.0,<4",
    "whitenoise>=6.9,<7",
    "gunicorn>=23,<27",
]

[project.optional-dependencies]
# Only for a Postgres host (DATABASE_URL=postgres://…); local dev and tests use SQLite.
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["tests"]
addopts = "-q"
